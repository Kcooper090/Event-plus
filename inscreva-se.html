<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="inscreva-se.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event+</title>
</head>
<body>

    <main class="signup">

        <div class="signup-card">

            <div class="signup-visual">

                <span class="visual-logo">+</span>

                <div class="visual-text">
                    <p class="visual-eyebrow">Você pode</p>
                    <p class="visual-headline">Ter acesso a espaços e eventos pensados para o seu momento</p>
                </div>

            </div>

            <div class="signup-form">

                <span class="form-logo">+</span>

                <h1>Inscreva-se</h1>
                <p class="form-subtitle">Acompanhe sua agenda, salve lugares favoritos e organize sua presença em um só lugar.</p>




                <form id="signup-form" novalidate>

                    <div class="form-group">
                     <label for="nome">Nome</label>
                    <div class="password-field">
                     <input type="text" id="nome" name="nome" placeholder="Como podemos te chamar">
                    </div>
                     <small class="error-msg"></small>
                    </div>

                    <div class="form-group">
                     <label for="email">Seu e-mail</label>
                    <div class="password-field">
                     <input type="email" id="email" name="email" placeholder="voce@email.com">
                    </div>
                    <small class="error-msg"></small>
                    </div>

                    <div class="form-group">
                     <label for="senha">Senha</label>
                    <div class="password-field">
                     <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres">
                    </div>
                     <small class="error-msg"></small>
                    </div>

                    <button type="submit" class="submit-btn">Inscreva-se</button>

                </form>

                


                <div class="divider"><span>ou continue com</span></div>

                <div class="alt-login">
                    <button type="button">
                        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.36 0-4.35-1.59-5.07-3.73H.9v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.93 10.69A5.4 5.4 0 0 1 3.65 9c0-.59.1-1.16.28-1.69V4.98H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.02l3.03-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.98l3.03 2.33C4.65 5.17 6.64 3.58 9 3.58Z"/></svg>
                        Google
                    </button>

                    <button type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        Telefone
                    </button>

                </div>

                <p class="form-footer">Já tem uma conta? <a href="index.html">Entrar</a></p>

            </div>

        </div>

    </main>

     <footer>

        <p>© 2026 Event+. Todos os direitos reservados.</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
